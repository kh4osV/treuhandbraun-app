name: Android Release (APK)

# Baut das Android-APK per EAS (Expo Cloud) und hängt es an ein
# GitHub-Release an. Der Download-Link ist damit ein GitHub-Release-Asset
# und läuft — anders als der von Expo gehostete EAS-Link (~30 Tage) —
# nicht ab.
#
# Voraussetzung (einmalig):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     Name:  EXPO_TOKEN
#     Wert:  Access-Token aus https://expo.dev/settings/access-tokens
#            (Account "kh4osv", der auch das EAS-Projekt besitzt)
#
# Auslösen:
#   • Manuell: Actions → "Android Release (APK)" → Run workflow
#   • Automatisch: Git-Tag "v*" pushen (z. B. git tag v1.0.1 && git push origin v1.0.1)
#
# Profil: Vorgabe und Tag-Push bauen IMMER production-apk (Prod-Stack). Ein
# preview-Build (Dev-Stack) muss bewusst gewählt werden und erscheint nur als
# Pre-Release mit "-dev" in Tag und Dateiname, nie als "Latest" — die
# Release-Seite ist der Download-Link für Kunden. Ein Dev-Build lädt nach
# fluke-web-dev hoch; ein dort eingegebener Prod-Mandanten-Code wird mit 401
# abgelehnt, und die Belege kommen nie in der Buchhaltung an (Wyland,
# 10/2026: v1.0.1-1 war ein preview-Build und als "Latest" markiert).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS-Build-Profil"
        type: choice
        default: production-apk
        options:
          - production-apk    # Prod-Stack, direkt installierbares APK (für Kunden)
          - preview          # Dev-Stack, nur zum Testen — wird Pre-Release
  push:
    tags:
      - "v*"

permissions:
  contents: write            # nötig für "gh release create"

jobs:
  build:
    name: EAS Build + GitHub Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS / Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Fail early if EXPO_TOKEN missing
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN-Secret fehlt. In Repo-Settings anlegen (siehe Workflow-Kommentar)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Tag-Push hat keine inputs → production-apk. "suffix" landet in Tag und
      # Dateiname, damit ein Dev-APK nie wie ein Kunden-APK aussieht.
      - name: Resolve build profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production-apk' }}"
          echo "value=$PROFILE" >> "$GITHUB_OUTPUT"
          if [ "$PROFILE" = "production-apk" ]; then
            echo "dev=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "dev=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: appver
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App-Version: $VERSION"

      - name: Run EAS build (Android APK)
        id: build
        run: |
          set -euo pipefail
          echo "Starte EAS-Build (Profil: ${{ steps.profile.outputs.value }}) …"
          BUILD_JSON=$(eas build \
            --platform android \
            --profile "${{ steps.profile.outputs.value }}" \
            --non-interactive \
            --wait \
            --json)
          echo "$BUILD_JSON" > build.json
          APK_URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.applicationArchiveUrl")
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "undefined" ]; then
            echo "::error::Keine APK-URL im EAS-Build-Ergebnis gefunden."
            cat build.json
            exit 1
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o "fluke-${{ steps.appver.outputs.version }}${{ steps.profile.outputs.suffix }}.apk" \
            "${{ steps.build.outputs.apk_url }}"
          ls -lh fluke-*.apk

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v${{ steps.appver.outputs.version }}${{ steps.profile.outputs.suffix }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with APK (Prod)
        if: steps.profile.outputs.dev == 'false'
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.value }}" \
            "fluke-${{ steps.appver.outputs.version }}.apk" \
            --title "Fluke ${{ steps.tag.outputs.value }} (Android)" \
            --notes "Automatischer Android-APK-Build via EAS (Profil: ${{ steps.profile.outputs.value }}).

          **Installation:** APK unten herunterladen → auf dem Android-Gerät öffnen → einmalig „Unbekannte Quellen / Diese Quelle erlauben\" bestätigen.

          Dieser Download-Link liegt auf GitHub und läuft nicht ab." \
            --latest

      - name: Create GitHub Pre-Release with APK (Dev)
        if: steps.profile.outputs.dev == 'true'
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.value }}" \
            "fluke-${{ steps.appver.outputs.version }}-dev.apk" \
            --title "Fluke ${{ steps.tag.outputs.value }} (Android, TESTVERSION Dev)" \
            --notes "⚠️ **Testversion gegen den Dev-Stack — nicht an Mandanten weitergeben.** Belege aus dieser App landen in der Dev-Umgebung, nicht in der Buchhaltung; Prod-Mandanten-Codes werden abgelehnt.

          Automatischer Android-APK-Build via EAS (Profil: ${{ steps.profile.outputs.value }})." \
            --prerelease \
            --latest=false
